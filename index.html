<header><div class="wrap head"><a class="logo" href="#"><span class="logo-mark">◒</span>好好吃饭</a><div class="head-right"><small>一餐一饭，认真生活</small><button id="randomBtn">↗ 随机一道</button></div></div></header>
<main class="wrap">
<section class="hero"><div class="hero-content"><div class="eyebrow">EVERYDAY, MADE BETTER</div><h1>今天吃什么？<br><em>从一顿好饭开始。</em></h1><p>不必纠结下一餐。从家常小炒到周末大餐，<br>简单的一餐，也值得认真对待。</p><form id="searchForm" class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="searchInput" placeholder="搜索菜名，比如：红烧肉、鸡蛋" aria-label="搜索菜谱" autocomplete="off"><button type="submit">搜索</button></form><div class="hero-hint">从完整菜谱库中，找到你的下一餐。</div></div><div class="daily-card"><div class="daily-top"><span>DAILY INSPIRATION</span><span class="daily-badge">✦ 今天吃什么</span></div><div class="daily-photo" id="dailyPhoto"><span class="daily-placeholder">🍽️</span></div><div class="daily-info"><small>来一点新灵感</small><h2 id="dailyName">正在挑一道好菜…</h2><p id="dailyCategory">家常菜谱 · 详细做法</p></div><div class="daily-actions"><button id="dailyShuffle" type="button">↻ 换一道</button><button id="dailyOpen" class="primary" type="button">查看做法 ↗</button></div></div></section>

<script>
'use strict';
const OWNER='haolanchen88-stack',REPO='HowToCook',BRANCH='master';
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const categories=[['all','全部','✨'],['vegetable_dish','素菜','🥬'],['meat_dish','荤菜','🥩'],['aquatic','水产','🐟'],['breakfast','早餐','🍳'],['staple','主食','🍚'],['soup','汤类','🍲'],['dessert','甜品','🍰'],['drink','饮品','🥤'],['semi-finished','半成品','🍱'],['condiment','调味','🧂']];
const pal=[['#f4e5d4','#ede4cb'],['#e4ece1','#f0e9d9'],['#f1e3d8','#e7eae3'],['#e6eee9','#f1edda'],['#f0e7da','#e4ece7'],['#e7e9e0','#f6e7d6']];
const $=id=>document.getElementById(id);let all=[],category='all',term='',onlyFav=false,limit=24,photoMap=new Map(),requestToken=0;const contentCache=new Map();
let favourites=new Set();try{favourites=new Set(JSON.parse(localStorage.getItem('cook-favs-v1')||'[]'))}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const encPath=p=>p.split('/').map(encodeURIComponent).join('/');
const local=p=>new URL(encPath(p),document.baseURI).href;
const emoji=c=>({vegetable_dish:'🥦',meat_dish:'🍗',aquatic:'🦐',breakfast:'🍳',staple:'🍜',soup:'🍲',dessert:'🍮',drink:'🍹','semi-finished':'🥟',condiment:'🧂'})[c]||'🍽️';
function fetchText(p){const sources=[local(p),RAW+encPath(p)];return (async()=>{let last;for(const url of sources){try{const r=await fetch(url);if(r.ok){const t=await r.text();if(t && !t.trim().startsWith('<!doctype html') && !t.trim().startsWith('<html'))return t;}last=Error(`HTTP ${r.status}`)}catch(e){last=e}}throw last||Error('无法加载')})()}
function loadList(markdown){const re=/\[([^\]\n]+)\]\((?:\.\/)?(dishes\/[^)\s]+?\.md)(?:\?[^)]*)?\)/g;const used=new Set();let m;const rows=[];while((m=re.exec(markdown))){let p=m[2];try{p=decodeURIComponent(p)}catch(e){}if(used.has(p))continue;used.add(p);let c=p.split('/')[1];if(!categories.some(x=>x[0]===c))continue;rows.push({name:m[1].replace(/\\([()])/g,'$1'),path:p,cat:c})}return rows}
function getPhoto(path){return photoMap.get(path)||''}
function renderCategories(){const arr=categories.map(([id,label,icon])=>{let n=id==='all'?all.length:all.filter(x=>x.cat===id).length;return `<button class="chip ${id===category?'sel':''}" data-cat="${id}">${icon} ${label}<em>${n}</em></button>`}).join('');$('categories').innerHTML=arr;}
function results(){return all.filter(x=>(category==='all'||category===x.cat)&&(!term||x.name.toLowerCase().includes(term.toLowerCase()))&&(!onlyFav||favourites.has(x.path))).sort((a,b)=>Number(Boolean(getPhoto(b.path)))-Number(Boolean(getPhoto(a.path))))}
function cardHTML(r,i){const [a,b]=pal[(r.name.charCodeAt(0)+r.name.length)%pal.length];const p=getPhoto(r.path),short=categories.find(x=>x[0]===r.cat)?.[1]||'家常菜',saved=favourites.has(r.path);return `<article class="recipe" style="--i:${i%12}"><button class="recipe-main" data-path="${esc(r.path)}" aria-label="查看${esc(r.name)}做法"><div class="thumb" style="--a:${a};--b:${b}"><span>${emoji(r.cat)}</span>${p?`<img loading="lazy" src="${esc(local(p))}" alt="${esc(r.name)}" onerror="this.remove()">`:`<small class="no-photo">暂无实拍图</small>`}</div><div class="copy"><h3>${esc(r.name)}</h3><div class="meta"><span>${esc(short)} · 详细做法</span><b>查看 →</b></div></div></button><button class="save-icon ${saved?'is-saved':''}" data-save="${esc(r.path)}" aria-label="${saved?'取消收藏':'收藏'}${esc(r.name)}">${saved?'♥':'♡'}</button></article>`}
function render(){renderCategories();$('favBtn').classList.toggle('active',onlyFav);$('favBtn').textContent=(onlyFav?'♥ 我的收藏':'♡ 我的收藏')+' · '+favourites.size;const rows=results();$('summary').textContent=`共 ${all.length} 道菜谱 · 当前找到 ${rows.length} 道 · 有实拍图的优先展示`;const shown=rows.slice(0,limit);$('cards').innerHTML=shown.length?shown.map(cardHTML).join(''):`<div class="empty"><strong>暂时没有找到菜谱</strong>试试换个关键词或者清除筛选</div>`;$('moreBtn').hidden=shown.length>=rows.length;}
async function loadPhotos(){try{const response=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);if(!response.ok)throw Error('GitHub API error');const obj=await response.json();const dirs=new Map();for(const f of obj.tree||[]){if(f.type!=='blob'||!/^dishes\/.+\.(?:jpe?g|png|webp|gif)$/i.test(f.path))continue;const d=f.path.slice(0,f.path.lastIndexOf('/')+1);const list=dirs.get(d)||[];list.push(f.path);dirs.set(d,list)}const matched=new Map();for(const r of all){const d=r.path.slice(0,r.path.lastIndexOf('/')+1);const stem=r.path.slice(d.length).replace(/\.md$/,'');const photos=dirs.get(d)||[];const match=photos.find(x=>x.slice(d.length).replace(/\.[^.]+$/,'')===stem)||(d.split('/').length>3?photos.find(x=>!/(二维码|logo|流程|wechat)/i.test(x)):undefined);if(match)matched.set(r.path,match)}photoMap=matched;render();if(!getPhoto(featuredPath))pickDaily();else renderDaily()}catch(e){/* 菜谱文本仍正常，封面暂用图形占位 */}}
async function init(){try{const md=await fetchText('README.md');all=loadList(md);if(all.length<100)throw Error('未识别到完整菜谱目录');render();pickDaily();loadPhotos();const hash=location.hash.match(/^#recipe=(.*)$/);if(hash){try{openRecipe(decodeURIComponent(hash[1]))}catch(e){}}}catch(e){$('summary').textContent='菜谱目录加载失败';$('cards').innerHTML=`<div class="empty"><strong>暂时无法读取菜谱</strong>请确认 GitHub Pages 发布成功，并刷新页面。<p><a href="https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/README.md" target="_blank" rel="noopener" style="color:#436a50;text-decoration:underline">直接查看仓库菜谱目录</a></p></div>`;}}
// 不依赖第三方 CDN 的轻量 Markdown 渲染器。
function inlineMd(s,base){let text=esc(s);text=text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(_,alt,url)=>`<img loading="lazy" src="${esc(assetUrl(url,base))}" alt="${alt}">`);text=text.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,url)=>`<a href="${esc(assetUrl(url,base))}" target="_blank" rel="noopener">${label}</a>`);text=text.replace(/`([^`]+)`/g,'<code>$1</code>');text=text.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');text=text.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');return text}
function assetUrl(value,base){const url=value.replace(/&amp;/g,'&');if(/^https?:\/\//i.test(url))return url;if(url.startsWith('#'))return url;const parent=base.slice(0,base.lastIndexOf('/')+1);const pieces=(parent+url).split('/'),stack=[];for(const p of pieces){if(p==='..')stack.pop();else if(p&&p!=='.')stack.push(p)}return local(stack.join('/'))}
function markdownToHTML(md,path){const lines=md.replace(/\r\n?/g,'\n').split('\n');let html='',list='',code=false,codeBody=[],para=[];const closePara=()=>{if(para.length){html+=`<p>${inlineMd(para.join(' '),path)}</p>`;para=[]}};const closeList=()=>{if(list){html+=`</${list}>`;list=''}};for(let line of lines){const t=line.trim();if(/^```/.test(t)){closePara();closeList();if(!code){code=true;codeBody=[]}else{html+=`<pre><code>${esc(codeBody.join('\n'))}</code></pre>`;code=false}continue}if(code){codeBody.push(line);continue}if(!t){closePara();closeList();continue}const heading=t.match(/^(#{1,6})\s+(.*)$/);if(heading){closePara();closeList();const level=Math.min(4,heading[1].length);html+=`<h${level}>${inlineMd(heading[2],path)}</h${level}>`;continue}if(/^[-*_]{3,}$/.test(t)){closePara();closeList();html+='<hr>';continue}if(t.startsWith('>')){closePara();closeList();html+=`<blockquote>${inlineMd(t.replace(/^>\s*/,''),path)}</blockquote>`;continue}const item=t.match(/^([-*+]\s+|\d+[.)]\s+)(.*)$/);if(item){closePara();const next=/^\d/.test(item[1])?'ol':'ul';if(list!==next){closeList();list=next;html+=`<${list}>`}html+=`<li>${inlineMd(item[2],path)}</li>`;continue}if(/^!\[[^\]]*\]\([^)]+\)$/.test(t)){closePara();closeList();html+=inlineMd(t,path);continue}if(t.includes('|')&&t.startsWith('|')){closePara();closeList();html+=`<p>${inlineMd(t,path)}</p>`;continue}para.push(t)}closePara();closeList();if(code)html+=`<pre><code>${esc(codeBody.join('\n'))}</code></pre>`;return html}
let featuredPath='';
function pickDaily(){if(!all.length)return;const pictured=all.filter(x=>Boolean(getPhoto(x.path)));const pool=pictured.length?pictured:all;let i=Math.floor(Math.random()*pool.length);if(pool.length>1&&pool[i].path===featuredPath)i=(i+1)%pool.length;featuredPath=pool[i].path;renderDaily()}
function renderDaily(){const r=all.find(x=>x.path===featuredPath);if(!r)return;const p=getPhoto(r.path),cat=categories.find(x=>x[0]===r.cat)?.[1]||'家常菜';$('dailyName').textContent=r.name;$('dailyCategory').textContent=cat+' · 详细步骤';$('dailyPhoto').innerHTML=p?`<img src="${esc(local(p))}" alt="${esc(r.name)}" onerror="this.remove()">`:`<span class="daily-placeholder">${emoji(r.cat)}</span><span class="photo-label">暂无实拍图</span>`}
function toggleFavourite(path){if(favourites.has(path))favourites.delete(path);else favourites.add(path);try{localStorage.setItem('cook-favs-v1',JSON.stringify([...favourites]))}catch(e){}render()}
async function openRecipe(path){const r=all.find(x=>x.path===path);if(!r)return;const token=++requestToken;$('backdrop').classList.add('show');$('drawer').classList.add('show');document.body.style.overflow='hidden';$('article').innerHTML=`<h1>${esc(r.name)}</h1><div class="status">正在读取详细做法…</div>`;history.replaceState(null,'',`#recipe=${encodeURIComponent(r.path)}`);try{let md=contentCache.get(path);if(!md){md=await fetchText(path);contentCache.set(path,md)}if(token!==requestToken)return;const categoryLabel=categories.find(x=>x[0]===r.cat)?.[1]||'家常菜';const imageMatch=md.match(/!\[([^\]]*)\]\(([^)]+)\)/);const pic=getPhoto(path)||(imageMatch?(()=>{const p=imageMatch[2];const parent=path.slice(0,path.lastIndexOf('/')+1);return (parent+p.replace(/^\.\//,'')).replace(/\/\.\//g,'/')})():'');const heading=`<div class="tag">${emoji(r.cat)} ${esc(categoryLabel)}</div><h1>${esc(r.name)}</h1>`;const hero=pic?`<div class="detail-hero"><img src="${esc(local(pic))}" alt="${esc(r.name)}" onerror="this.parentNode.textContent='${emoji(r.cat)}'"></div>`:`<div class="detail-hero">${emoji(r.cat)}</div>`;const body=markdownToHTML(md.replace(/^#\s+[^\n]+\n?/,'').replace(/^\s*\n/,''),path);const saved=favourites.has(path);$('article').innerHTML=heading+hero+`<div class="md">${body}</div><div class="detail-nav"><button id="saveRecipe">${saved?'♥ 已收藏':'♡ 收藏这道菜'}</button><a href="https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${encPath(path)}" target="_blank" rel="noopener">查看原始菜谱 ↗</a></div>`;$('saveRecipe').onclick=()=>{toggleFavourite(path);$('saveRecipe').textContent=favourites.has(path)?'♥ 已收藏':'♡ 收藏这道菜';};}catch(e){if(token===requestToken)$('article').innerHTML=`<h1>${esc(r.name)}</h1><p class="status">菜谱加载失败，请刷新后重试，或从仓库查看原文。</p><a href="https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${encPath(path)}" target="_blank" rel="noopener">去 GitHub 查看</a>`} $('drawer').scrollTop=0;}
function closeRecipe(){requestToken++;$('drawer').classList.remove('show');$('backdrop').classList.remove('show');document.body.style.overflow='';if(location.hash.startsWith('#recipe='))history.replaceState(null,'',location.pathname+location.search)}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();term=$('searchInput').value.trim();limit=24;render();$('cards').scrollIntoView({behavior:'smooth',block:'start'})});$('searchInput').addEventListener('input',e=>{term=e.target.value.trim();limit=24;render()});$('categories').addEventListener('click',e=>{const button=e.target.closest('[data-cat]');if(!button)return;category=button.dataset.cat;limit=24;render()});$('cards').addEventListener('click',e=>{const save=e.target.closest('[data-save]');if(save){toggleFavourite(save.dataset.save);return}const button=e.target.closest('[data-path]');if(button)openRecipe(button.dataset.path)});$('moreBtn').onclick=()=>{limit+=24;render()};$('favBtn').onclick=()=>{onlyFav=!onlyFav;limit=24;render()};$('resetBtn').onclick=()=>{category='all';term='';onlyFav=false;limit=24;$('searchInput').value='';render()};$('randomBtn').onclick=()=>{if(featuredPath)openRecipe(featuredPath)};$('dailyShuffle').onclick=pickDaily;$('dailyOpen').onclick=()=>{if(featuredPath)openRecipe(featuredPath)};$('closeBtn').onclick=closeRecipe;$('backdrop').onclick=closeRecipe;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRecipe()});window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#recipe='))closeRecipe()});init();
</script>
